name: Amazon product refresh

# Daily: refresh product images/ASINs from the Amazon Creators API.
# Amazon requires product content shown on the site to be refreshed every 24 hours.
on:
  # Owner rule 2026-10-27: no schedule here (no Amazon secrets in this repo, it only failed); launch-site.yml in rentersmarthome.us refreshes this site.
  workflow_dispatch:
  # New posts get their ASINs and product photos right after they are pushed.
  push:
    paths:
      - 'src/content/blog/**'

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Amazon data
        env:
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ vars.AMAZON_CREATORS_VERSION }}
        run: npm run amazon:refresh
      - name: QA agent (all posts, with online checks)
        env:
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ vars.AMAZON_CREATORS_VERSION }}
        run: node scripts/qa.mjs --all --online
      - name: Validate and build
        run: |
          npm run check:content
          npm run build
      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "best-tripod-agents"
          git config user.email "agents@users.noreply.github.com"
          git add src/content data/qa && { [ ! -f data/amazon-unmatched.json ] || git add data/amazon-unmatched.json; }
          git commit -m "content: daily Amazon product refresh [skip ci]"
          # Owner rule 2026-10-29 (no repeated "Run failed" emails): rebase onto pushes that landed during the run,
          # retry, and if it still can't push, leave a warning instead of failing (the next run catches up).
          for i in 1 2 3; do git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push && break; sleep $((i * 10)); done || true
          git status -sb | grep -q ahead && echo "::warning title=push skipped::another push won the race; the next run will commit these changes" || true
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
